name: xnu-tulip

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      # This repo IS the patched xnu source (itsvic's tulip series on top of
      # xnu-8796.141.3): build the tree directly with the stock Apple make
      # rules — they already know the TULIP machine config (makedefs +
      # config/MASTER.arm64.tulip). No darwin-xnu-build wrapper.
      - uses: actions/checkout@v4

      - name: Env
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          which mig || echo "no mig in PATH"

      - name: Build kernel
        env:
          KERNEL_CONFIGS: ${{ env.KERNEL_CONFIG }}
          ARCH_CONFIGS: ARM64
          MACHINE_CONFIGS: TULIP
          MAKEFLAGS: -k
        run: |
          set -o pipefail
          make 2>&1 | tee build.log

      - name: Kernel output
        if: always()
        run: |
          find BUILD -type f -name "kernel*" | head -10
          ls -la BUILD/sym/ 2>/dev/null | head -10

      - name: Compile errors
        if: failure()
        run: |
          grep -n -B4 -A8 -E ' error:' build.log | head -600 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-${{ github.run_number }}
          path: |
            BUILD/sym/kernel*
            BUILD/dst/kernel*
            build.log
          if-no-files-found: warn
